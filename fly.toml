# Fly.io deployment.
# `app` must be globally unique across all of Fly; derived from the GitHub owner so it
# very likely is. Change it if `fly apps create` reports the name is taken.
app = "kelvinkiumbe1-dating-app"

# Where the machine runs. `fly platform regions` lists the options — pick the one
# closest to your users and change this before the first deploy.
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Database__Provider = "postgres"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Zero would stop the app entirely between requests; one machine keeps latency sane
  # while still suspending when idle.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
